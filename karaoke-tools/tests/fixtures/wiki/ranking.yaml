# Weights for karaoke-tools' `suggest` tool. Edit freely: it's re-read on every
# call (no restart). Anything missing here falls back to the built-in default.
# A candidate's score is the sum of the points below.

# Position in YouTube's Mix for the reference song (YouTube's own "similar").
mix_position: {top5: 3, top15: 2, top40: 1}
# In both the YouTube Mix and the YouTube Music radio.
both_sources: 2
# Plans with several reference songs: per additional mix the song shows up in.
multiple_mixes_per_extra: 2
# Catalog status; "outside" = not in the catalog yet.
status: {ready: 3, practicing: 2, wishlist: 1, outside: 0}
# Average audience reaction from events (standout 3, good 2, weak 1).
crowd_score: {gte_2_5: 2, gte_2_0: 1}
# Similarity to the reference song (catalog songs only).
same_era: 1
tempo_or_energy_within_1: 1   # same tempo_class, or energy within 1
same_mood: 1                  # at least one mood in common
# Older 👎 taps: down_penalty each, halved every half_life_days, total capped at
# ±cap. (per_up/per_down from the chat polls are no longer used: 👍 rows count
# as likes.)
relation: {cap: 6, half_life_days: 180}
# ♥ like links between a song and the seed (Mini App ♥, older 👍 rows). Used
# both ways for similarity ("A is like B" = "B is like A"), directed for "after".
like_link: 3
down_penalty: -1
# ⭐ my_rating bands (1-10).
rating: {"9-10": 3, "7-8": 2, "5-6": 0, "3-4": -1, "1-2": -3}
# At most this many catalog songs per singer in one list.
max_per_singer: 3
# Plans skip songs rated this low or lower.
exclude_rating_at_or_below_in_plans: 2
